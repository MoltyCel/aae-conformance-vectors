name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install cryptography jsonschema jcs pytest==9.1.1
      - name: Validate vectors against schema
        run: python3 tools/validate_schema.py
      - name: Run reference verifier (must be 15/15)
        run: python3 examples/python-verify.py
      - name: Run reference verifier unit tests
        run: python3 -m pytest tests/
      - name: Verify vectors are reproducible from the committed test keys
        run: |
          python3 tools/build_vectors.py
          if ! git diff --quiet -- vectors/; then
            echo "vectors/ differs from a fresh rebuild — commit the regenerated vectors"
            git --no-pager diff -- vectors/
            exit 1
          fi
      - name: Check counterpart fixture integrity pins
        run: |
          cd interop/psea
          shasum -a 256 -c psea-fixture-v0.sha256
      - name: Validate enforce vectors against the enforce schema
        run: python3 tools/validate_enforce_schema.py
      - name: Run enforce reference verifier (must be 26/26)
        run: python3 examples/enforce-verify.py
      - name: Verify enforce vectors are reproducible from the committed test key
        run: |
          python3 tools/build_enforce_vectors.py
          if ! git diff --quiet -- vectors/enforce/; then
            echo "vectors/enforce/ differs from a fresh rebuild — commit the regenerated vectors"
            git --no-pager diff -- vectors/enforce/
            exit 1
          fi
      - name: Verify resume vectors are reproducible and match the scenario matrix
        run: |
          python3 tools/build_resume_vectors.py
          if [ -n "$(git status --porcelain -- vectors/resume/)" ]; then
            echo "vectors/resume/ differs from a fresh rebuild — commit the regenerated vectors"
            git status --porcelain -- vectors/resume/
            git --no-pager diff -- vectors/resume/
            exit 1
          fi
      - name: Validate composition vectors against the extension schema
        run: python3 tools/validate_interop_schema.py
      - name: Run composition checker (must be 6/6, compared row by row)
        run: python3 examples/composition-verify.py
      - name: Run negative controls (must be 11/11, compared row by row)
        run: python3 tools/run_negative_controls.py
      - name: Verify composition vectors are reproducible
        run: |
          python3 tools/build_interop_psea.py
          if ! git diff --quiet -- interop/; then
            echo "interop/ differs from a fresh rebuild — commit the regenerated files"
            git --no-pager diff -- interop/
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Build the TypeScript runner
        working-directory: runner/ts
        run: |
          npm ci
          npm run build
      - name: Python runner against the reference adapter (must be 83/83)
        run: |
          PYTHONPATH=runner/python python3 -m aae_conformance \
            --impl "python3 adapters/python-reference/adapter.py" | tee python-runner.out
          grep -qx '83/83 passed' python-runner.out
      - name: TypeScript runner against the reference adapter (must be 83/83)
        run: |
          node runner/ts/dist/cli.js \
            --impl "python3 adapters/python-reference/adapter.py" | tee ts-runner.out
          grep -qx '83/83 passed' ts-runner.out
      - name: Runner tests, Python (failure modes and parity with the TypeScript runner)
        env:
          AAE_REQUIRE_TS_RUNNER: "1"
        run: python3 -m pytest runner/python/tests/
      - name: Runner tests, TypeScript
        working-directory: runner/ts
        run: npm test
      - name: Recompute every enforce verdict and core digest step by step
        run: python3 tools/explain_enforce.py vectors/enforce/*.json > /dev/null
