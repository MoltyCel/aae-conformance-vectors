name: ete-vectors

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install cryptography jcs moltrust-enforce==0.7.1
      - name: Rebuild the Earn-then-Exploit vectors and AER records, compare, verify
        run: python3 tools/build_ete_vectors.py --check
      - name: Recompute every ete verdict and core digest step by step
        run: python3 tools/explain_enforce.py vectors/ete/*.json > /dev/null
